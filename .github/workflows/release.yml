name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Package
        run: python scripts/package_release.py --output "dist/video-audio-transcribe-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes
